[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoflux"
version = "0.1.0"
description = "Neural age transformation library"
authors = [{name = "ParisNeo", email = "parisneoai@gmail.com"}]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.1",
    "torchvision>=0.15.2",
    "datasets>=2.14.0",
    "huggingface_hub>=0.17.0",
    "hydra-core>=1.3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "Pillow>=9.4.0",
    "omegaconf>=2.3.0"
]

[project.optional-dependencies]
dev = ["pytest", "flake8", "black"]

[project.urls]
Homepage = "https://github.com/ParisNeo/ChronoFlux"
Documentation = "https://github.com/ParisNeo/ChronoFlux/docs"